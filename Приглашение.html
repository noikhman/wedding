<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приглашение: Данил и Ирина</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Lora:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root { --main: #3b352d; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            width: 100%; height: 100%; 
            background-color: #000; 
            font-family: 'Lora', serif; 
            color: #1a1a1a;
        }

        /* ЧЕРНАЯ ЗАВЕСА (ЗАТЕМНЕНИЕ ВНАЧАЛЕ) */
        #loader-curtain {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #000;
            z-index: 1000;
            transition: opacity 1.2s ease, visibility 1.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- ОБЩАЯ СТРУКТУРА --- */
        .main-wrapper { display: flex; flex-direction: column; width: 100%; }

        .video-section {
            width: 100%; height: 100vh;
            background: #000;
            position: fixed; top: 0; left: 0;
            z-index: 1;
        }
        video { width: 100%; height: 100%; object-fit: cover; display: block; }

        .content-section {
            position: relative;
            z-index: 10;
            width: 100%;
        }

        .hero-photo {
            height: 100vh; width: 100%;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.4)), 
                              url('https://raw.githubusercontent.com/noikhman/wedding/main/%E2%84%96999_159.JPG');
            background-size: cover; background-position: center;
            display: flex; align-items: flex-end; justify-content: center;
            padding-bottom: 12vh;
        }
        .hero-photo h1 { 
            font-family: 'Cinzel', serif; color: #fff; 
            font-size: 2.2em; letter-spacing: 3px; 
            text-shadow: 0 2px 15px rgba(0,0,0,0.6);
            text-align: center;
        }

        .scroll-gap { height: 80vh; background: transparent; }

        .info-card-wrap {
            padding: 40px 20px 120px;
            display: flex; justify-content: center;
            background: transparent;
        }
        .card {
            background: rgba(255, 255, 252, 0.45);
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            padding: 60px 30px; border-radius: 40px;
            text-align: center; width: 100%; max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.25);
        }
        .date-box {
            background: var(--main); color: #fff;
            margin: 35px -30px; padding: 30px 10px;
        }
        .btn {
            display: inline-block; margin-top: 35px;
            padding: 16px 45px; background: var(--main);
            color: #fff; text-decoration: none;
            border-radius: 50px; text-transform: uppercase;
            font-size: 0.85em; letter-spacing: 2px;
        }

        @media (min-width: 1025px) {
            .main-wrapper { flex-direction: row; }
            .video-section { position: sticky; width: 40%; height: 100vh; flex-shrink: 0; }
            .content-section { width: 60%; z-index: 10; background: #fdfdfb; }
            .hero-photo { height: 100vh; padding-bottom: 8vh; box-shadow: -10px 0 30px rgba(0,0,0,0.1); }
            .scroll-gap { display: none; }
            .info-card-wrap { background: #fdfdfb; padding: 100px 40px; }
            .card { background: #fff; backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; border: none; max-width: 500px; }
        }
    </style>
</head>
<body>

    <div id="loader-curtain"></div>

    <audio id="music" loop preload="auto">
        <source src="https://raw.githubusercontent.com/noikhman/wedding/main/Stephen%20Sanchez%20-%20Until%20I%20Found%20You%20(Piano%20Karaoke).mp3" type="audio/mpeg">
    </audio>

    <div class="main-wrapper">
        <div class="video-section">
            <video id="video" playsinline webkit-playsinline muted loop preload="auto">
                <source src="https://raw.githubusercontent.com/noikhman/wedding/main/video5350360388351334576.mp4" type="video/mp4">
            </video>
        </div>

        <div class="content-section">
            <section class="hero-photo">
                <h1>Данил & Ирина</h1>
            </section>

            <div class="scroll-gap"></div>

            <section class="info-card-wrap">
                <div class="card">
                    <p style="text-transform: uppercase; letter-spacing: 4px; font-size: 0.8em; margin-bottom: 25px; color: var(--main); font-weight: bold;">Save the Date</p>
                    <p style="font-style: italic; line-height: 1.8; font-size: 1.2em; color: #000;">
                        Дорогие и любимые!<br>
                        Один из дней лета станет самым важным в нашей жизни.<br>
                        И мы хотим провести его вместе с вами.
                    </p>
                    
                    <div class="date-box">
                        <p style="font-family: 'Cinzel', serif; font-size: 2em; letter-spacing: 4px;">26 . 07 . 2026</p>
                        <p style="text-transform: uppercase; font-size: 0.9em; margin-top: 5px;">Воскресенье • 16:30</p>
                    </div>

                    <div style="margin: 40px 0;">
                        <p style="font-size: 1.2em; font-weight: bold; color: #000;">Ресторан «Престиж»</p>
                        <p style="color: #000; margin-top: 5px; font-weight: 500;">г. Слободзея, ул. Фрунзе, 12</p>
                    </div>

                    <a href="https://maps.app.goo.gl/dsVRbwvtxUHcUdaE7" target="_blank" class="btn">Открыть карту</a>
                </div>
            </section>
        </div>
    </div>

    <script>
        const audio = document.getElementById('music');
        const video = document.getElementById('video');
        const curtain = document.getElementById('loader-curtain');

        function startAll() {
            // Убираем затемнение
            if (curtain) {
                curtain.style.opacity = '0';
                setTimeout(() => { curtain.style.visibility = 'hidden'; }, 1200);
            }
            
            // Запуск медиа
            if (video) video.play();
            if (audio && audio.paused) {
                audio.volume = 0.5;
                audio.play();
            }
        }

        // Авто-скрытие заставки через 1.5 секунды, если пользователь ничего не нажал
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (curtain && curtain.style.opacity !== '0') {
                    curtain.style.opacity = '0';
                    setTimeout(() => { curtain.style.visibility = 'hidden'; }, 1200);
                }
            }, 1500);
        });

        window.addEventListener('touchstart', startAll, {once: true});
        window.addEventListener('click', startAll, {once: true});
        window.addEventListener('scroll', startAll, {once: true});

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) { audio.pause(); video.pause(); }
            else { if (audio.currentTime > 0) audio.play(); video.play(); }
        });
    </script>
</body>
</html>
